[workspace]
resolver = "2"
members = [
    "crates/cs-core",
    "crates/cs-core-napi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["KChat Authors"]

[workspace.dependencies]
# kdrive-rust-sdk crates (path deps to sibling repo)
kchat-drive-types = { path = "../kdrive-rust-sdk/crates/kchat-drive-types" }
kchat-drive-crypto = { path = "../kdrive-rust-sdk/crates/kchat-drive-crypto" }
kchat-drive-identity = { path = "../kdrive-rust-sdk/crates/kchat-drive-identity" }
kchat-drive-mls-bridge = { path = "../kdrive-rust-sdk/crates/kchat-drive-mls-bridge" }
kchat-drive-sync-core = { path = "../kdrive-rust-sdk/crates/kchat-drive-sync-core" }
kchat-client-runtime = { path = "../kdrive-rust-sdk/crates/kchat-client-runtime" }
kchat-drive-store-sqlite = { path = "../kdrive-rust-sdk/crates/kchat-drive-store-sqlite" }
kchat-drive-transport-core = { path = "../kdrive-rust-sdk/crates/kchat-drive-transport-core" }
kchat-drive-transport-native = { path = "../kdrive-rust-sdk/crates/kchat-drive-transport-native" }

# Common deps
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
minicbor = { version = "0.24", features = ["derive", "alloc"] }
hex = "0.4"
base64 = "0.22"
rand = "0.8"
zstd = "0.13"
proptest = { version = "1.5", default-features = false, features = ["std"] }
tracing = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }

# SQLCipher
rusqlite = { version = "0.36", features = ["bundled-sqlcipher-vendored-openssl"] }

# Key wrapping (RFC 3394)
aes-kw = { version = "0.2", default-features = false }
# Post-quantum signatures (ML-DSA-65 / FIPS 204)
ml-dsa = { version = "0.0.4", features = ["rand_core"] }
# Argon2id KDF for passphrase-based key recovery
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Regex for entity extraction
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# Image decoding for thumbnails
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Unicode normalization for tokenizer
unicode-normalization = "0.1"
# Binary serde helpers
serde_bytes = "0.11"
# CBOR encoding for wire formats (serde-compatible)
ciborium = "0.2"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Optional ML deps (behind features)
# ort is provided transitively by kchat-ai-runtime crates (kchat-encoder, kchat-safety, kchat-asr)
# which pin ort = "=2.0.0-rc.10" to avoid native-library linking conflicts.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
rustfft = { version = "6.2", default-features = false }
instant-distance = { version = "0.6", default-features = false }

# kchat-ai-runtime crates (path deps to sibling repo)
kchat-core = { path = "../kocal/kchat-ai-runtime/crates/kchat-core" }
kchat-encoder = { path = "../kocal/kchat-ai-runtime/crates/kchat-encoder" }
kchat-safety = { path = "../kocal/kchat-ai-runtime/crates/kchat-safety" }
kchat-asr = { path = "../kocal/kchat-ai-runtime/crates/kchat-asr" }
