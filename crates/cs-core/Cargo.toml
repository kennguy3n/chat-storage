[package]
name = "cs-core"
description = "Platform-agnostic core for KChat chat-storage: E2EE local storage, multilingual search, archive, backup, offload, rehydration — built on kdrive-rust-sdk."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
test-support = []
# ML feature: enables on-device ML via kchat-ai-runtime crates.
# kchat-encoder provides text embeddings + safety classification (ONNX).
# kchat-safety provides vision (MobileCLIP-S2) when onnx-runtime-vision is also enabled.
# kchat-asr provides Whisper audio transcription (ONNX).
# kchat-core provides EP selection, OCR bridge, inference cache, model manager.
ml = [
    "dep:kchat-core",
    "dep:kchat-encoder",
    "dep:kchat-safety",
    "dep:kchat-asr",
    "kchat-encoder/onnx-runtime",
    "kchat-safety/onnx-runtime",
    "kchat-asr/onnx-runtime",
    "kchat-core/sqlcipher",
]
ml-vision = ["ml", "kchat-safety/onnx-runtime-vision"]
ml-domain-adapters = ["ml", "kchat-encoder/domain-adapters"]

[dependencies]
# kdrive-rust-sdk crates
kchat-drive-types = { workspace = true }
kchat-drive-crypto = { workspace = true }
kchat-drive-identity = { workspace = true }
kchat-drive-sync-core = { workspace = true }
kchat-client-runtime = { workspace = true }
kchat-drive-transport-core = { workspace = true }

# Common deps
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
ed25519-dalek = { workspace = true }
minicbor = { workspace = true, features = ["derive", "alloc"] }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
zstd = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

# Key wrapping (RFC 3394)
aes-kw = { workspace = true }
# Post-quantum signatures
ml-dsa = { workspace = true }
# Argon2id for key recovery
argon2 = { workspace = true }
# Regex for entity extraction
regex = { workspace = true }
# Image decoding for thumbnails
image = { workspace = true }
# Unicode normalization for tokenizer
unicode-normalization = { workspace = true }
# Binary serde helpers
serde_bytes = { workspace = true }
# CBOR encoding for wire formats (serde-compatible)
ciborium = { workspace = true }

# SQLCipher
rusqlite = { workspace = true }

# Optional ML deps — kchat-ai-runtime crates
kchat-core = { workspace = true, optional = true }
kchat-encoder = { workspace = true, optional = true }
kchat-safety = { workspace = true, optional = true }
kchat-asr = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
sha2 = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "e2e"
path = "../../tests/e2e_tests.rs"
